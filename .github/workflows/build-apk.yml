name: Build Offline NMR-HRMS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Release Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias nmrhrms \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass maodie2026 -keypass maodie2026 \
              -dname "CN=MaodieTownJimiKing, OU=LabTools, O=MaodieTown, L=Beijing, S=Beijing, C=CN"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Rename Output APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk NMR-HRMS-Offline-v1.0.apk
          else
            cp app/build/outputs/apk/release/*.apk NMR-HRMS-Offline-v1.0.apk
          fi
          ls -lh NMR-HRMS-Offline-v1.0.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMR-HRMS-Offline-APK
          path: NMR-HRMS-Offline-v1.0.apk
          retention-days: 30
